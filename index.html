<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Fractal Flames — Sinapsialab × Charly BGood</title>
    <meta name="description" content="Laboratorio de experimentación con programación creativa generativa. Crea y explora fractales tipo Flame en tiempo real. Un experimento de Sinapsialab y Charly BGood." />
    <meta name="author" content="Sinapsialab, Charly BGood" />
    <meta name="keywords" content="fractal, fractal flame, generative art, creative coding, sinapsialab, charly bgood, arte generativo" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fractals.sinapsialab.com/" />
    <meta property="og:title" content="Fractal Flames — Sinapsialab × Charly BGood" />
    <meta property="og:description" content="Laboratorio de experimentación con programación creativa generativa. Crea fractales tipo Flame en tiempo real." />
    <meta property="og:image" content="https://res.cloudinary.com/dr8pwzxzn/image/upload/v1789483514/fractal-flame-1789445330076_g9r8rl.png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Sinapsialab" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://fractals.sinapsialab.com/" />
    <meta name="twitter:title" content="Fractal Flames — Sinapsialab × Charly BGood" />
    <meta name="twitter:description" content="Laboratorio de experimentación con programación creativa generativa. Crea fractales tipo Flame en tiempo real." />
    <meta name="twitter:image" content="https://res.cloudinary.com/dr8pwzxzn/image/upload/v1789483514/fractal-flame-1789445330076_g9r8rl.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#101018" />
    <meta name="color-scheme" content="dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-container">
      <aside class="controls-panel">
        <header>
          <h1>Fractal_Flames</h1>
          <p>Laboratorio de creación generativa</p>
          <p class="attribution">
            <a href="https://sinapsialab.com" target="_blank" rel="noopener">Sinapsialab</a>
            &nbsp;×&nbsp;
            <a href="https://github.com/CharlyBGood" target="_blank" rel="noopener">Charly BGood</a>
          </p>
        </header>

        <div class="palette-section">
          <div class="section-label">Paleta de color</div>
          <div id="palette-grid"></div>
        </div>

        <form id="global-controls-form">
          <div class="control-group">
            <label for="gamma">Gamma <span class="value-display" id="gamma-value">2.2</span></label>
            <input type="range" id="gamma" min="1" max="5" step="0.1" value="2.2" />
          </div>
          <div class="control-group">
            <label for="brightness">Brillo <span class="value-display" id="brightness-value">5.0</span></label>
            <input type="range" id="brightness" min="1" max="15" step="0.1" value="5.0" />
          </div>
          <div class="control-group">
            <label for="symmetry">Simetría <span class="value-display" id="symmetry-value">1</span></label>
            <input type="range" id="symmetry" min="1" max="6" step="1" value="1" />
          </div>
          <details class="advanced-details">
            <summary>Avanzado</summary>
            <div class="control-group">
              <label for="quality">Calidad <span class="value-display" id="quality-value">1.0M</span></label>
              <input type="range" id="quality" min="100000" max="8000000" step="100000" value="1000000" />
            </div>
            <div class="control-group">
              <label for="scale">Vista <span class="value-display" id="scale-value">3.0</span></label>
              <input type="range" id="scale" min="1.5" max="8" step="0.1" value="3.0" />
            </div>
            <div class="control-group">
              <label for="background-mode">Fondo</label>
              <select id="background-mode">
                <option value="dark">Oscuro (negro)</option>
                <option value="transparent">Transparente</option>
              </select>
            </div>
          </details>
        </form>

        <div class="xforms-section">
          <div class="xforms-header">
            <div class="section-label">Transformaciones</div>
            <button id="add-xform-btn" class="add-btn">+ Añadir</button>
          </div>
          <div id="xforms-container"></div>
        </div>

        <div class="action-buttons">
          <button id="randomize-btn" class="glow-button accent">
            Aleatorio
          </button>
          <button id="download-btn" class="glow-button secondary">
            Descargar HD
          </button>
        </div>
      </aside>

      <main class="canvas-container">
        <canvas id="fractal-canvas" width="800" height="800"></canvas>
        <div id="loading-indicator" style="display: none">
          <div class="spinner"></div>
          <span>Renderizando...</span>
        </div>
      </main>
    </div>

    <script src="flame.js"></script>
    <script src="app.js"></script>
  </body>
</html>
